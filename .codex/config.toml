[mcp_servers.dis_mevzuat]
command = ".venv/bin/dis-mevzuat"
args = ["serve"]
cwd = "."
enabled = true
required = false
enabled_tools = ["search_sources", "list_sources", "get_source", "get_chunk", "system_status"]
default_tools_approval_mode = "approve"
startup_timeout_sec = 15
tool_timeout_sec = 60

[mcp_servers.dis_mevzuat.env]
DM_DATA_DIR = "data"
DM_ENABLE_ADMIN_TOOLS = "false"
DM_TRANSPORT = "stdio"
