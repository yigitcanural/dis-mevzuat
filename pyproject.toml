[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dis-mevzuat"
version = "0.2.0"
description = "Provider-neutral Turkish health-tourism regulations MCP with versioned hybrid retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Türkiye Sağlık Turizmi Mevzuat contributors" }]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastmcp>=3.0,<4",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pypdf>=5.0,<7",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
dis-mevzuat = "dis_mevzuat.cli:main"
saglik-turizmi-mevzuat = "dis_mevzuat.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "pytest-asyncio>=0.24,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/dis_mevzuat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
